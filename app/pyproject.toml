[project]
name = "redaktion"
version = "0.1.0"
description = "Local front end for the bitz newsletter pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "markdown-it-py>=3.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.scripts]
redaktion = "redaktion.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redaktion"]
